<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صندوق السكن</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#1d2939;background:#f6f8fa}*{box-sizing:border-box}body{margin:0;padding:28px 14px}.wrap{max-width:580px;margin:auto}h1{font-size:23px;text-align:center;margin:8px 0 25px}.card{background:white;border:1px solid #e8edf0;border-radius:15px;padding:20px;margin-bottom:14px}.balance{text-align:center;padding:29px 15px}.muted{color:#667085;font-size:14px}.money{font-size:36px;font-weight:800;color:#16834b;margin-top:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats .card{margin-bottom:0}.stat{font-size:20px;font-weight:bold;margin-top:8px}h2{font-size:17px;margin:0 0 16px}label{display:block;font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;font:inherit;background:white}button{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:bold;cursor:pointer;background:#16834b;color:white;width:100%;margin-top:15px}.secondary{background:#eef7f1;color:#146c3c}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{margin:0}.hidden{display:none}.entry{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f2;gap:10px}.entry:last-child{border:0}.entry strong{display:block;font-size:14px}.entry small{display:block;color:#667085;margin-top:5px}.amount{font-weight:bold;white-space:nowrap}.expense{color:#c43535}.income{color:#16834b}.empty{text-align:center;color:#667085;padding:22px}.delete{width:auto;background:transparent;color:#98a2b3;margin:0;padding:5px;font-size:12px}.row{display:flex;align-items:center;gap:8px}.foot{text-align:center;color:#98a2b3;font-size:12px;margin-top:20px}
</style>
</head>
<body><main class="wrap">
<h1>🏠 صندوق السكن</h1>
<section class="card balance"><div class="muted">الرصيد المتبقي</div><div id="balance" class="money">0.00 د.أ</div></section>
<div class="stats"><section class="card"><div class="muted">إجمالي الإيداعات</div><div id="income" class="stat">0.00 د.أ</div></section><section class="card"><div class="muted">إجمالي المصاريف</div><div id="spent" class="stat">0.00 د.أ</div></section></div>
<div class="card" style="margin-top:14px"><div class="tabs"><button id="expenseTab" type="button">إضافة مصروف</button><button id="incomeTab" type="button" class="secondary">إضافة مبلغ</button></div>
<form id="form"><label for="person">اسم الشخص</label><input id="person" maxlength="60" placeholder="مثلاً: أحمد" required><div id="itemWrap"><label for="item">شو اشتريت؟</label><input id="item" maxlength="120" placeholder="مثلاً: مواد تنظيف" required></div><label for="amount">المبلغ (دينار أردني)</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required><button id="submit" type="submit">تسجيل المصروف</button></form></div>
<section class="card"><h2>آخر العمليات</h2><div id="history" class="empty">ما في عمليات لحد الآن</div></section>
<p class="foot">البيانات محفوظة على هذا المتصفح فقط</p>
</main><script>
const KEY='housing-fund-v1';let transactions=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))transactions=saved.filter(t=>t&&['income','expense'].includes(t.type)&&Number.isSafeInteger(t.cents)&&t.cents>0&&typeof t.person==='string'&&typeof t.item==='string')}catch(e){}let mode='expense';const $=id=>document.getElementById(id);const money=cents=>(cents/100).toFixed(2)+' د.أ';function totals(){return transactions.reduce((a,t)=>{a[t.type]+=t.cents;return a},{income:0,expense:0})}function save(){localStorage.setItem(KEY,JSON.stringify(transactions))}function render(){const t=totals();$('balance').textContent=money(t.income-t.expense);$('income').textContent=money(t.income);$('spent').textContent=money(t.expense);const h=$('history');h.replaceChildren();if(!transactions.length){h.className='empty';h.textContent='ما في عمليات لحد الآن';return}h.className='';for(const x of [...transactions].reverse()){const div=document.createElement('div');div.className='entry';const details=document.createElement('div');const title=document.createElement('strong');title.textContent=x.item;const meta=document.createElement('small');meta.textContent=x.person+' · '+new Date(x.date).toLocaleString('ar-JO');details.append(title,meta);const side=document.createElement('div');side.className='row';const value=document.createElement('span');value.className='amount '+(x.type==='expense'?'expense':'income');value.textContent=(x.type==='expense'?'-':'+')+money(x.cents);const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='حذف';del.setAttribute('aria-label','حذف العملية');del.onclick=()=>{if(confirm('متأكد بدك تحذف العملية؟')){transactions=transactions.filter(y=>y.id!==x.id);save();render()}};side.append(value,del);div.append(details,side);h.append(div)}}function setMode(m){mode=m;$('itemWrap').classList.toggle('hidden',m==='income');$('item').required=m==='expense';$('submit').textContent=m==='expense'?'تسجيل المصروف':'إضافة المبلغ';$('expenseTab').className=m==='expense'?'':'secondary';$('incomeTab').className=m==='income'?'':'secondary'}$('expenseTab').onclick=()=>setMode('expense');$('incomeTab').onclick=()=>setMode('income');$('form').onsubmit=e=>{e.preventDefault();const person=$('person').value.trim(),item=$('item').value.trim(),value=Number($('amount').value),cents=Math.round(value*100);if(!person||(mode==='expense'&&!item)||!Number.isSafeInteger(cents)||cents<=0||Math.abs(value*100-cents)>1e-7){alert('تأكد من البيانات والمبلغ');return}const t=totals();if(mode==='expense'&&cents>t.income-t.expense){alert('الرصيد غير كافي');return}transactions.push({id:crypto.randomUUID(),type:mode,person,item:mode==='income'?'تعبئة الصندوق':item,cents,date:new Date().toISOString()});try{save()}catch(e){transactions.pop();alert('تعذر حفظ البيانات على المتصفح');return}$('form').reset();render()};render();
</script></body></html>
